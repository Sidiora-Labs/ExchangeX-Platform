name: Bug report
description: Something behaves incorrectly
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Use a private advisory — see SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you observed, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      description: Backend output, browser console, or the response body. Redact secrets.
      render: shell

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "4.6.6 or a commit SHA"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Trading (spot / futures / binary)
        - Wallets & transactions
        - Admin panel
        - Authentication / KYC
        - Extensions
        - Frontend / UI
        - Deployment / Docker
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Node:
        - pnpm:
        - MySQL:
        - Deployment: PM2 / Docker / dev
    validations:
      required: true
